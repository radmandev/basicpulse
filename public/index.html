<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BasicPulse — Inbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="brand" href="/">BasicPulse</a>
  <a href="/" class="active">Inbox</a>
  <a href="/settings.html">Settings</a>
  <div id="conn-dot" title="Connecting…"></div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Conversations</h2>
      <input type="search" id="search-input" class="search-input" placeholder="Search…" />
    </div>
    <div class="conv-list" id="conv-list">
      <div class="empty-state" id="conv-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>No conversations yet.<br/>Waiting for messages…</p>
      </div>
    </div>
  </aside>

  <main class="thread" id="thread">
    <div class="no-conv" id="no-conv">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Select a conversation to read messages</p>
    </div>
    <div class="thread-header" id="thread-header" style="display:none"></div>
    <div class="messages" id="msg-pane" style="display:none"></div>
    <div class="reply-bar" id="reply-bar" style="display:none">
      <textarea id="reply-input" class="reply-input" placeholder="Type a reply… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="reply-send" class="reply-send-btn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
